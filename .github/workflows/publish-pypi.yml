name: Publish to PyPI

on:
  push:
    tags:
      - "v*" # déclenché sur les tags v2026.5.2, v2027.1.0, etc.
  workflow_dispatch: # permet un déclenchement manuel depuis l'UI GitHub

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 : build (séparé du publish, comme recommandé par PyPA)
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # CRITIQUE pour hatch-vcs : sans l'historique et les tags,
          # la version sera 0.0.0 au lieu du tag
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # Job 2 : publish via Trusted Publishing (OIDC)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Doit correspondre au "Environment name" configuré sur PyPI
    environment: pypi

    permissions:
      id-token: write # OBLIGATOIRE pour Trusted Publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
