[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "s1ifr"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "LGPL-3.0-only" }
description = "python methods to find / move / copy / sort / store / count Sentinel-1 SAR mission files in Ifremer archive"
readme = "README.md"
authors = [{ name = "Antoine GROUAZEL", email = "antoine.grouazel@ifremer.fr" }]
keywords = [
  "earth-observation",
  "remote-sensing",
  "satellite-imagery",
  "filesystem",
  "sar",
  "sentinel-1",
  "archive",
  "database",
  "files",
  "SAFE",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
dependencies = ["numpy", "xarray", "lxml", "tqdm", "pandas", "pyyaml"]

[project.optional-dependencies]
dev = [
  "pre-commit>=2.15.0",
  "flake8",
  "flake8-junit-report-basic",
  "pytest>=6",
  "pytest-cov>=2",
  "pytest-mock",
  "coverage[toml]",
  "ruff",
  "black",
  "isort",
]
docs = ["sphinx", "sphinx-rtd-theme", "nbsphinx", "ipython"]

[project.urls]
Homepage = "https://github.com/umr-lops/s1ifr"
Repository = "https://github.com/umr-lops/s1ifr"
Issues = "https://github.com/umr-lops/s1ifr/issues"
Documentation = "https://s1ifr.readthedocs.io"
Changelog = "https://github.com/umr-lops/s1ifr/blob/main/CHANGELOG.md"

[project.scripts]
syncsafe = "s1ifr.move_safe_from_ifr_to_ifr:main"
syncsafebatch = "s1ifr.scripts.move_safe_from_ifr_to_ifr_prun:main"
archivesafe = "s1ifr.sentinel1_pieuvre:main"
get-s1-full-path-safe = "s1ifr.scripts.get_full_path_SAFE:entrypoint"
familyprod = "s1ifr.paths_safe_product_family:entrypoint"


# ---------------------------------------------------------------------------
# Hatch: versioning via git tags (nécessite hatch-vcs) + packaging
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "s1ifr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["s1ifr"]

[tool.hatch.build.targets.sdist]
include = [
  "/s1ifr",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "/s1ifr/localconfig.yml",
  "/s1ifr/*.backup",
  "**/__pycache__",
  "**/.ipynb_checkpoints",
]


# ---------------------------------------------------------------------------
# Outils de dev (inchangés)
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
skip_gitignore = true
float_to_top = true
default_section = "THIRDPARTY"
known_first_party = "s1ifr"

[tool.black]
line-length = 79

[tool.coverage.run]
source = ["s1ifr"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING"]

[tool.ruff.lint]
ignore = [
  "E402",  # module level import not at top of file
  "E501",  # line too long - let black worry about that
  "E731",  # do not assign a lambda expression, use a def
  "UP038", # type union instead of tuple for isinstance etc
]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "I",   # isort
  "UP",  # Pyupgrade
  "TID", # flake8-tidy-imports
  "W",
]
extend-safe-fixes = [
  "TID252", # absolute imports
  "UP031",  # percent string interpolation
]
fixable = ["I", "TID252", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["s1ifr"]
known-third-party = ["xarray", "toolz", "construct"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
