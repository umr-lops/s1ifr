[project]
name = "s1ifr"
requires-python = ">= 3.10"
license = "MIT"
description = "python methods to find / move / copy / sort / store / count Sentinel-1 SAR mission files in Ifremer archive"
readme = "README.md"
dependencies = ["numpy", "xarray", "lxml", 'tqdm', 'pandas', 'pyyaml']
keywords = [
  "earth-observation",
  "remote-sensing",
  "satellite-imagery",
  "filesystem",
  "sar",
  "sentinel-1",
  "archive",
  "database",
  "files",
  "SAFE",

]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[tool.poetry]
name = "s1ifr"
version = "2026.2.9"
description = "python methods to find / move / copy / sort / store / count Sentinel-1 SAR mission files in Ifremer archive"
license = "LGPL-3.0-only"
authors = ["Antoine GROUAZEL <antoine.grouazel@ifremer.fr>"]
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: GNU Lesser General Public License (LGPLv3)",
]
exclude = ["tests"]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = "*"
xarray = "*"
lxml = "*"
tqdm = "*"
pandas = "*"
pyyaml = "*"

[project.urls]
homepage = "https://gitlab.ifremer.fr/lops-wave/s1ifr.readthedocs.io"
documentation = "https://gitlab.ifremer.fr/lops-wave/s1ifr.readthedocs.io"
repository = "https://gitlab.ifremer.fr/lops-wave/s1ifr"
changelog = "https://gitlab.ifremer.fr/lops-wave/s1ifr.readthedocs.io/en/latest/changelog.html"

[project.scripts]
syncsafe = "s1ifr.move_safe_from_ifr_to_ifr:main"
syncsafebatch = "s1ifr.scripts.move_safe_from_ifr_to_ifr_prun:main"
archivesafe = 's1ifr.sentinel1_pieuvre:main'
get-s1-full-path-safe = 's1ifr.scripts.get_full_path_SAFE:entrypoint'
familyprod = 's1ifr.paths_safe_product_family:entrypoint'

[build-system]
requires = ["setuptools>=64.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["s1ifr"]

#[tool.setuptools.packages.find]
#where = ["s1ifr"]

[tool.setuptools_scm]
fallback_version = "999"

[tool.isort]
profile = "black"
skip_gitignore = true
float_to_top = true
default_section = "THIRDPARTY"
known_first_party = "s1ifr"

[tool.black]
line-length = 79

[tool.coverage.run]
source = ["s1ifr"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING"]

[tool.ruff.lint]
ignore = [
  "E402",  # module level import not at top of file
  "E501",  # line too long - let black worry about that
  "E731",  # do not assign a lambda expression, use a def
  "UP038", # type union instead of tuple for isinstance etc
]
select = [
  "F",   # Pyflakes
  "E",   # Pycodestyle
  "I",   # isort
  "UP",  # Pyupgrade
  "TID", # flake8-tidy-imports
  "W",
]
extend-safe-fixes = [
  "TID252", # absolute imports
  "UP031",  # percent string interpolation
]
fixable = ["I", "TID252", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["s1ifr"]
known-third-party = ["xarray", "toolz", "construct"]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"
